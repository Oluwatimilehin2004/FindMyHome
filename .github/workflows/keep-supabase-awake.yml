# Keeps the free-tier Supabase project from pausing after 7 days without activity.
# Runs every 3 days (and on demand from the Actions tab) by calling a public read endpoint.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (the same one as in .env)

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the public API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets are not set." >&2
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/search_properties" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"q": ""}')
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "The project did not respond normally. It may be paused: restore it from the Supabase dashboard." >&2
            exit 1
          fi
